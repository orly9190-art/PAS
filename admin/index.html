<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | PT Prima Armada Samudra</title>
<link rel="icon" href="../assets/img/logo-pas.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root {
  --navy: #0A2240; --blue: #13508C; --gold: #C9872F; --bg: #F3F7FA; --line: #DEE6EE;
  --mut: #56697E; --ink: #1C2733; --ok: #1E7A4C; --err: #B3261E; --side: 268px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: 130px; }
body { margin: 0; font-family: 'Barlow', 'Segoe UI', Arial, sans-serif; color: var(--ink); background: var(--bg); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- Login ---------- */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(135deg, #0A2240 0%, #13508C 100%); }
.login-card { width: 100%; max-width: 400px; background: #fff; border-radius: 4px; padding: 34px 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.login-card .logo { height: 42px; width: auto; display: block; margin: 0 0 22px; }
.login-card h1 { margin: 0 0 4px; font-size: 24px; color: var(--navy); }
.login-card p.sub { margin: 0 0 22px; color: var(--mut); font-size: 15px; }
.login-card label { display: block; font-weight: 600; font-size: 14px; margin: 0 0 6px; color: var(--navy); }
.login-card input { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid #BCCBDA; border-radius: 2px; background: #fff; margin-bottom: 16px; }
.login-card .err { color: var(--err); font-size: 14px; margin: -4px 0 14px; font-weight: 600; }
.login-card .back { display: inline-block; margin-top: 18px; color: var(--blue); font-weight: 600; font-size: 14px; text-decoration: none; }
.login-card .back:hover { text-decoration: underline; }

/* ---------- Tombol ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid transparent; border-radius: 2px; font-weight: 600; font-size: 14.5px; text-decoration: none; white-space: nowrap; }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { filter: brightness(1.08); }
.btn-line { background: #fff; border-color: #BCCBDA; color: var(--navy); }
.btn-line:hover { background: var(--bg); }
.btn-danger { background: #fff; border-color: #E0B4B0; color: var(--err); }
.btn-danger:hover { background: #FDF1F0; }
.btn-sm { min-height: 32px; padding: 0 12px; font-size: 13.5px; }
.full { width: 100%; min-height: 46px; }

/* ---------- Kerangka ---------- */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--navy); color: #CFDEEC; display: flex; flex-direction: column; overflow-y: auto; z-index: 50; }
.side .brand { padding: 22px 22px 18px; border-bottom: 1px solid rgba(255,255,255,.12); }
.side .brand span.pill { display: inline-flex; background: #fff; border-radius: 3px; padding: 9px 12px; }
.side .brand img { height: 30px; width: auto; display: block; }
.side .brand small { display: block; margin-top: 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase; color: #8FC6EA; }
.side nav { padding: 14px 12px; flex: 1; }
.side .grp-title { margin: 18px 10px 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: #7C97B3; }
.side .grp-title:first-child { margin-top: 4px; }
.side a.item { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 42px; padding: 0 12px; border-radius: 3px; color: #CFDEEC; text-decoration: none; font-weight: 600; font-size: 15px; border-left: 3px solid transparent; }
.side a.item:hover { background: rgba(255,255,255,.07); }
.side a.item.on { background: rgba(255,255,255,.12); color: #fff; border-left-color: var(--gold); }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--gold); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.side .foot { padding: 14px 12px 18px; border-top: 1px solid rgba(255,255,255,.12); display: grid; gap: 8px; }
.side .foot a, .side .foot button { display: flex; align-items: center; min-height: 40px; padding: 0 12px; border: 1px solid rgba(255,255,255,.25); border-radius: 3px; background: transparent; color: #fff; text-decoration: none; font-weight: 600; font-size: 14.5px; text-align: left; }
.side .foot a:hover, .side .foot button:hover { background: rgba(255,255,255,.08); }

.main { margin-left: var(--side); min-width: 0; }
.mbar { display: none; position: sticky; top: 0; z-index: 45; background: var(--navy); color: #fff; align-items: center; gap: 12px; padding: 0 14px; min-height: 52px; }
.mbar button { background: none; border: 0; color: #fff; font-size: 26px; line-height: 1; padding: 6px 8px; }
.mbar strong { font-size: 16px; }
.scrim { display: none; position: fixed; inset: 0; background: rgba(10,34,64,.55); z-index: 48; }

.wrap { max-width: 980px; margin: 0 auto; padding: 32px 28px 80px; }
.eyebrow { margin: 0 0 8px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; font-size: 12px; color: var(--gold); }
h1.pt { margin: 0 0 6px; font-size: 32px; line-height: 1.2; color: var(--navy); }
p.lead { margin: 0 0 24px; color: var(--mut); font-size: 16.5px; max-width: 720px; }

.note { background: #FFF8EC; border: 1px solid #EBD3A6; border-left: 4px solid var(--gold); border-radius: 2px; padding: 12px 16px; font-size: 14.5px; color: #5C4719; margin: 0 0 22px; }
.note strong { color: #4A3811; }

/* ---------- Dashboard ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 0 0 24px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 18px 20px; }
.stat b { display: block; font-size: 32px; line-height: 1.1; color: var(--blue); }
.stat span { font-size: 14px; color: var(--mut); font-weight: 600; }
.meter { height: 6px; background: var(--line); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); }
.card { background: #fff; border: 1px solid var(--line); border-radius: 3px; margin: 0 0 24px; overflow: hidden; }
.card h2 { margin: 0; padding: 16px 20px; font-size: 18px; color: var(--navy); border-bottom: 1px solid var(--line); }
.card .pad { padding: 18px 20px; }
table.tb { width: 100%; border-collapse: collapse; }
table.tb th, table.tb td { padding: 12px 20px; text-align: left; border-bottom: 1px solid var(--line); font-size: 15px; }
table.tb tr:last-child td { border-bottom: 0; }
table.tb th { font-size: 12.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--mut); background: #FAFCFD; }
table.tb td.n { font-weight: 700; color: var(--blue); }
table.tb td.n.zero { color: #9AA9B8; font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- Editor ---------- */
.ehead { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 22px 0 14px; margin: -22px 0 10px; border-bottom: 1px solid var(--line); }
.ehead .row1 { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.ehead h1 { margin: 0; font-size: 28px; line-height: 1.2; color: var(--navy); }
.ehead .meta { margin: 2px 0 0; color: var(--mut); font-size: 14px; }
.ehead .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; }
.seg a { min-height: 40px; padding: 0 16px; display: inline-flex; align-items: center; border: 1px solid #BCCBDA; background: #fff; color: var(--navy); font-weight: 700; font-size: 14px; text-decoration: none; }
.seg a + a { margin-left: -1px; }
.seg a:first-child { border-radius: 2px 0 0 2px; } .seg a:last-child { border-radius: 0 2px 2px 0; }
.seg a.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.ehead .row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 14px; }
.search { flex: 1 1 260px; min-height: 42px; padding: 0 14px; border: 1px solid #BCCBDA; border-radius: 2px; background: #fff; }
.status { font-size: 14px; font-weight: 600; color: var(--ok); white-space: nowrap; }
.status.err { color: var(--err); white-space: normal; }
.status.idle { color: var(--mut); font-weight: 500; }
.status.warn { color: #9A5F0C; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

details.grp { background: #fff; border: 1px solid var(--line); border-radius: 3px; margin: 14px 0 0; }
details.grp > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 18px; font-weight: 700; font-size: 17px; color: var(--navy); }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: ''; flex: none; width: 8px; height: 8px; border-right: 2.5px solid var(--gold); border-bottom: 2.5px solid var(--gold); transform: rotate(-45deg); transition: transform .15s; margin-right: 2px; }
details.grp[open] > summary::before { transform: rotate(45deg); }
details.grp > summary .t { flex: 1; min-width: 0; }
details.grp > summary .kind { font-size: 11.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--mut); font-weight: 700; }
.chip { font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 10px; background: var(--bg); color: var(--mut); }
.chip.ch { background: #FBEBD0; color: #7A4F10; }
.gbody { padding: 4px 18px 18px; border-top: 1px solid var(--line); display: grid; gap: 14px; }

.row { padding-top: 14px; border-left: 3px solid transparent; padding-left: 12px; margin-left: -12px; }
.row.changed { border-left-color: var(--gold); }
.row .rl { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 5px; min-height: 22px; }
.row .tag { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--blue); }
.row .rv { background: none; border: 0; padding: 0; color: var(--gold); font-weight: 700; font-size: 13px; text-decoration: underline; }
.row input[type=text], .row textarea { width: 100%; padding: 9px 12px; border: 1px solid #BCCBDA; border-radius: 2px; background: #fff; line-height: 1.55; font-size: 15.5px; }
.row textarea { resize: vertical; display: block; }
.row.changed input[type=text], .row.changed textarea { background: #FFFCF5; border-color: #E2C48B; }
.row.img { display: flex; gap: 16px; align-items: flex-start; }
.row.img .thumb { flex: none; width: 150px; height: 100px; border: 1px solid var(--line); border-radius: 2px; background: repeating-conic-gradient(#EEF3F7 0 25%, #fff 0 50%) 0 0/16px 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.row.img .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.row.img .ii { flex: 1; min-width: 0; }
.row.img .fn { font-size: 14.5px; color: var(--ink); word-break: break-all; margin: 0 0 10px; }
.row.img .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.empty { padding: 28px; text-align: center; color: var(--mut); }

.toast { position: fixed; right: 20px; bottom: 20px; background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 3px; font-weight: 600; font-size: 14.5px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 100; max-width: 360px; }

@media (max-width: 900px) {
  .side { transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .scrim.open { display: block; }
  .main { margin-left: 0; }
  .mbar { display: flex; }
  .wrap { padding: 22px 16px 70px; }
  .ehead { position: static; margin: 0 0 6px; padding: 0 0 14px; }
  html { scroll-padding-top: 70px; }
  .row.img { flex-direction: column; }
  .row.img .thumb { width: 100%; height: 150px; }
  h1.pt { font-size: 26px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="../assets/js/site-edit.js"></script>
<script src="../assets/js/admin-data.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
